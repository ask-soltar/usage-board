<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Usage Limits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #edeff2; --surface: #fafbfc; --ink: #14181f; --muted: #5b6472; --line: #d5dae1; --track: #dde1e8;
  --accent: #3b4fd9; --ok: #1f8a6b; --warn: #b7791f; --crit: #c7372f;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --surface: #161b22; --ink: #e6e9ee; --muted: #8d97a6; --line: #262d37; --track: #232a34;
    --accent: #8195ff; --ok: #3cc9a0; --warn: #e0a93b; --crit: #ff6b61; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 24px 48px; }
.wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.val { font-family: var(--font-data); font-size: 15px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
.plan { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.meter { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.meter:first-of-type { border-top: 0; padding-top: 0; }
.m-name { font-weight: 600; }
.readout { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pct { font-family: var(--font-data); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.pill { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 99px; padding: 2px 9px; }
.s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-crit { color: var(--crit); } .s-none { color: var(--muted); }
.bar { position: relative; height: 12px; background: var(--track); border-radius: 3px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: currentColor; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.legend { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.proj { font-size: 13.5px; min-height: 1.4em; }
.foot { color: var(--muted); font-size: 12.5px; }
.stale { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Usage Limits</h1>
    <p class="sub">Claude, ChatGPT, Gemini and GLM in one place. The black tick on each bar is where you should be if you spend evenly until the reset.</p>
  </header>
  <div class="headline" aria-live="polite"><span class="lbl">Closest to the cap</span><span class="val" id="hl">Loading…</span></div>
  <main class="grid" id="grid"></main>
  <p class="foot" id="foot"></p>
</div>
<script>
(function () {
  var HOUR = 3600e3, STALE_AFTER = 8 * HOUR;
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function dur(ms) {
    if (ms <= 0) return "now";
    var m = Math.round(ms / 60000), d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
    if (d > 0) return d + "d " + hh + "h";
    if (hh > 0) return hh + "h " + (mm < 10 ? "0" : "") + mm + "m";
    return mm + "m";
  }
  function when(ts) { return new Date(ts).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); }

  function metrics(m, now) {
    var period = m.hours * HOUR;
    var resetAt = m.resetAt;
    if (now >= resetAt) { resetAt += (Math.floor((now - resetAt) / period) + 1) * period; m = { used: 0, hours: m.hours, rolled: true }; }
    var remaining = Math.max(0, resetAt - now);
    var elapsed = Math.min(1, Math.max(0, 1 - remaining / period));
    var used = Math.max(0, Math.min(100, Number(m.used) || 0));
    var out = { used: used, elapsed: elapsed, remaining: remaining, resetAt: resetAt, cls: "s-ok", word: "Comfortable", proj: "", projected: used, rolled: !!m.rolled };
    var projected = elapsed > 0.03 ? used / elapsed : used;
    out.projected = projected;
    if (used >= 100) { out.cls = "s-crit"; out.word = "Capped"; out.proj = "At the cap. Resets in " + dur(remaining) + "."; }
    else if (used > 0 && elapsed > 0.03 && projected > 100) {
      var toFull = (100 - used) / (used / (elapsed * period));
      out.cls = used >= 85 ? "s-crit" : "s-warn"; out.word = "Ahead of pace";
      out.proj = "At this rate you hit the cap in " + dur(toFull) + ", " + dur(remaining - toFull) + " before the reset.";
    } else if (used > 0 && elapsed > 0.03) {
      out.proj = "On track to finish around " + Math.round(projected) + "% at the reset.";
      if (used >= 85) { out.cls = "s-warn"; out.word = "Nearly full"; }
    } else out.proj = "Too early in the window to project a pace.";
    if (out.rolled) out.proj = "This window reset after the last reading, so the real figure may be higher. " + "";
    return out;
  }

  function render(data) {
    var now = Date.now(), grid = document.getElementById("grid"), best = null;
    grid.textContent = "";
    data.providers.forEach(function (p) {
      var card = h("article", "card");
      var head = h("div", "card-head");
      head.appendChild(h("h2", "", p.name));
      var stale = p.checkedAt && now - p.checkedAt > STALE_AFTER;
      var plan = h("span", "plan" + (stale ? " stale" : ""), p.plan + (p.checkedAt ? " · read " + when(p.checkedAt) : ""));
      head.appendChild(plan);
      card.appendChild(head);
      if (p.note) card.appendChild(h("div", "foot", p.note));
      p.meters.forEach(function (m) {
        var sec = h("section", "meter");
        sec.appendChild(h("div", "m-name", m.label));
        var ro = h("div", "readout"), pct = h("span", "pct"), pill = h("span", "pill");
        var bar = h("div", "bar"), fill = h("div", "fill"), tick = h("div", "tick");
        var leg = h("div", "legend"), l1 = h("span"), l2 = h("span"), proj = h("div", "proj");
        if (m.unread) {
          pct.textContent = "—"; pill.textContent = "No reading"; ro.className = "readout s-none"; bar.className = "bar s-none";
          proj.textContent = "Not read yet.";
        } else {
          var x = metrics(m, now);
          pct.textContent = Math.round(x.used) + "%"; pill.textContent = x.word;
          ro.className = "readout " + x.cls; bar.className = "bar " + x.cls;
          fill.style.width = x.used + "%"; tick.style.left = "calc(" + (x.elapsed * 100) + "% - 1px)";
          l1.textContent = Math.round(x.elapsed * 100) + "% of window elapsed";
          l2.textContent = "resets in " + dur(x.remaining) + " · " + when(x.resetAt);
          proj.textContent = x.proj; if (x.cls !== "s-ok") proj.className = "proj " + x.cls;
          var score = Math.max(x.used, Math.min(150, x.projected));
          if (!best || score > best.score) best = { score: score, p: p, m: m, x: x };
        }
        ro.appendChild(pct); ro.appendChild(pill);
        bar.appendChild(fill); bar.appendChild(tick);
        leg.appendChild(l1); leg.appendChild(l2);
        [ro, bar, leg, proj].forEach(function (n) { sec.appendChild(n); });
        card.appendChild(sec);
      });
      grid.appendChild(card);
    });
    var hl = document.getElementById("hl");
    if (best) { hl.className = "val " + best.x.cls; hl.textContent = best.p.name + " · " + best.m.label + " " + Math.round(best.x.used) + "% · resets in " + dur(best.x.remaining); }
    else hl.textContent = "No readings yet";
    document.getElementById("foot").textContent = data.updatedAt
      ? "Last updated " + new Date(data.updatedAt).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + ". Percentages come from each app's own usage screen."
      : "";
  }

  function load(name) {
    return fetch(name + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  // data.json is written by the PC script; claude.json is refreshed separately (claude.ai blocks automated sign-in).
  Promise.all([load("data.json"), load("claude.json").catch(function () { return { providers: [] }; })])
    .then(function (both) {
      var d = { providers: both[1].providers.concat(both[0].providers), updatedAt: Math.max(both[0].updatedAt || 0, both[1].updatedAt || 0) };
      render(d); setInterval(function () { render(d); }, 60000);
    })
    .catch(function () { document.getElementById("hl").textContent = "Could not load data.json"; });
})();
</script>
</body>
</html>
